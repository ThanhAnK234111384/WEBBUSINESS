<html>
    <head>
        <meta charset='utf-8'>
        <title> Contact Result - Trịnh Thanh An </title>
    </head>
    <body>
        <h3> INFORMATION </h3>
        <p> Full name  <span id="name"></span></p>
        <p> Email  <span id="email"></span></p>
        <p> Gender <span id="gender"></span></p>
        <p> From to <span id="sendto"></span></p>
        <p> Content <span id="message"></span></p>
        <button type="button"><a href="Contact.html">Home</a></button>
        <script>
            var params = new URLSearchParams(window.location.search);
            document.getElementById("name").innerText = params.get("name");
            document.getElementById("email").innerText = params.get("email");
            document.getElementById("gender").innerText = params.get("gender");
            document.getElementById("sendto").innerText = params.get("sendto");
            document.getElementById("message").innerText = params.get("message");
        </script>
    </body>
</html>
