<html>
    <head>
        <meta charset='utf-8'>
        <title> Contact - Trịnh Thanh An </title>
    </head>
    <body>
        <form action="Contact_result.html" method="GET">
        <table>
            <tr>
                <td>
                    <label for="name"> Full name </label>
                </td>
                <td>
                    <input id="name" type="text" name="name" size="40">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email"> Email :</label>
                </td>
                <td>
                    <input id="email" type="email" name="email" size="40">
                </td>
            </tr>
            <tr>
                <td>
                    <label> Gender :</label>
                </td>
                <td>
                    <input id="male" type="radio" name="gender" value="Male">
                    <label for="male"> Male </label>
                    <input id="female" type="radio" name="gender" value="Female">
                    <label for="female"> Female </label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="region"> Send to </label>
                </td>
                <td>
                    <select id="sendto" name="sendto">
                        <option value="Editorial board"> Editorial board </option>
                        <option value="News Department"> News Department </option>
                        <option value="Board of Perspectives"> Board of Perspectives </option>
                        <option value="World Board"> World Board </option>
                        <option value="Business Department"> Business Department </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <label for="message">Content</label><br/>
                    <textarea id="message" name="message" rows="10" cols="40" placeholder="Something that you want to send"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="right">
                    <button type="submit">Send</button>
                    <button type="reset">Undo</button>
                </td>
            </tr>
        </table>
    </form>
    </body>
</html>
