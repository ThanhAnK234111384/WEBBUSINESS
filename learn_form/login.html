        <meta charset='utf-8'>
        <title> Login - Trịnh Thanh An </title>

            action="https://itbclub.uel.edu.vn/"
            method="get"
        >
            <table>
                <tr> 
                    <td>
                        <label for ="username">
                            User name:
                        </label>
                    </td>
                    <td> 
                        <input type="text" name="username" id="username"/>

                <tr>
                    <td> Password: </td>

                </tr>
                <tr>
                    <tr>
                        <td> &nbsp; </td>
                        <td> 
                            <input type="checkbox" name="save_infor" id="save_infor"/> 
                            <label for="savein4">
                                Save login information 
                            </label>
                        </td>
                    </tr>
                    <tr> 
                        <td> &nbsp; </td>
                        <td> 
                            <input type="submit" value="Login"/>
                        </td>
                    </tr>
                </tr>
            </table>
        </form>
    </body>
</html>
